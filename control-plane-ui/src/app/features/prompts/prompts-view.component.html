<section class="panel"><div class="panel-head"><div><h2>Prompt Registry</h2><p>Runtime prompts and planner contracts.</p></div><button class="primary" (click)="editPrompt()">＋ Prompt</button></div><div class="resource-grid"><article class="resource-card" *ngFor="let x of prompts()"><div class="resource-head"><span class="resource-icon">¶</span><span class="status-dot" [class.off]="!x.enabled"></span></div><h3>{{x.name}} <small>v{{x.version}}</small></h3><p>{{x.description}}</p><footer><small>{{x.source}}</small><div><button class="ghost small" (click)="editPrompt(x)">Edit</button><button class="icon-danger" (click)="deletePrompt(x)">×</button></div></footer></article></div></section>
