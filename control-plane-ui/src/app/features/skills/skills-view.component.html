<section class="panel"><div class="panel-head"><div><h2>Skill Registry</h2><p>Reusable reasoning and procedures.</p></div><button class="primary" (click)="host.editSkill()">＋ Skill</button></div><div class="resource-grid"><article class="resource-card" *ngFor="let x of host.skills()"><div class="resource-head"><span class="resource-icon">◇</span><span class="status-dot" [class.off]="!x.enabled"></span></div><h3>{{x.name}}</h3><p>{{x.description}}</p><footer><small>{{x.source}}</small><div><button class="ghost small" (click)="host.editSkill(x)">Edit</button><button class="icon-danger" (click)="host.deleteSkill(x)">×</button></div></footer></article></div></section>
