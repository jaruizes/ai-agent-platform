<section class="panel">
        <div class="panel-head"><div><h2>Sessions</h2><p>Explicit continuity boundaries grouping related executions and working context.</p></div><button class="primary" (click)="host.openCreateSession()">＋ Session</button></div>
        <div class="table-wrap"><table><thead><tr><th>Status</th><th>Name</th><th>Scope</th><th>Owner</th><th>Expires</th><th>Updated</th><th></th></tr></thead><tbody>
          <tr *ngFor="let s of host.sessions()" (click)="host.inspectSession(s)"><td><span class="status-pill" [ngClass]="host.statusClass(s.status)">{{s.status}}</span></td><td><strong>{{s.name||'Unnamed session'}}</strong><small class="block mono">{{s.id}}</small></td><td>{{s.scope}}</td><td>{{s.ownerKey||'—'}}</td><td>{{host.date(s.expiresAt)}}</td><td>{{host.date(s.updatedAt)}}</td><td><div class="actions"><button class="ghost small" *ngIf="s.status==='ACTIVE'" (click)="$event.stopPropagation();host.editSession(s)">Edit</button><button class="danger small" *ngIf="s.status==='ACTIVE'" (click)="$event.stopPropagation();host.closeSessionItem(s)">Close</button></div></td></tr>
        </tbody></table></div>
      </section>
