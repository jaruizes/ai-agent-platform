<section class="panel"><div class="panel-head"><div><h2>Agent Registry</h2><p>Logical agents, instructions, skills and knowledge assignments.</p></div><button class="primary" (click)="host.editAgent()">＋ Agent</button></div>
      <div class="resource-grid"><article class="resource-card" *ngFor="let x of host.agents()"><div class="resource-head"><span class="resource-icon">◎</span><span class="status-dot" [class.off]="!x.enabled"></span></div><h3>{{x.name}}</h3><p>{{x.description||'No description'}}</p><div class="chips"><span *ngFor="let s of x.skills">{{s.name}}</span></div><footer><small>{{x.source}}</small><div><button class="ghost small" (click)="host.editAgentKnowledge(x)">Knowledge</button><button class="ghost small" (click)="host.editAgent(x)">Edit</button><button class="icon-danger" (click)="host.deleteAgent(x)">×</button></div></footer></article></div></section>
