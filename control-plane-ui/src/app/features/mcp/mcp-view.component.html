<section class="panel"><div class="panel-head"><div><h2>MCP Servers</h2><p>Integration providers available to the Tool Layer.</p></div><button class="primary" (click)="host.editMcp()">＋ MCP Server</button></div><div class="resource-grid"><article class="resource-card" *ngFor="let x of host.mcpServers()"><div class="resource-head"><span class="resource-icon">⇄</span><span class="status-dot" [class.off]="!x.enabled"></span></div><h3>{{x.name}}</h3><p>{{x.description}}</p><code>{{x.command}} {{x.args.join(' ')}}</code><footer><small>{{x.source}}</small><div><button class="ghost small" (click)="host.editMcp(x)">Edit</button><button class="icon-danger" (click)="host.deleteMcp(x)">×</button></div></footer></article></div></section>
