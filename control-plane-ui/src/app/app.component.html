<div class="app-shell">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">A</span><span>AI <b>Platform</b></span></div>
    <nav>
      <button class="nav-item" [class.active]="view()==='dashboard'" (click)="setView('dashboard')">◫ <span>Dashboard</span></button>
      <button class="nav-item" [class.active]="view()==='executions'" (click)="setView('executions')">▶ <span>Executions</span></button>
      <button class="nav-item" [class.active]="view()==='approvals'" (click)="setView('approvals')">✓ <span>Approvals</span><i *ngIf="approvals().length">{{approvals().length}}</i></button>
      <div class="nav-section">PROCESS ORCHESTRATION</div>
      <button class="nav-item" [class.active]="view()==='processes'" (click)="setView('processes')">⌘ <span>Processes</span><i *ngIf="pendingProcessHumanTasks()">{{pendingProcessHumanTasks()}}</i></button>
      <button class="nav-item" [class.active]="view()==='services'" (click)="setView('services')">↗ <span>Service Registry</span></button>
      <div class="nav-section">CONTEXT & MEMORY</div>
      <button class="nav-item" [class.active]="view()==='sessions'" (click)="setView('sessions')">◉ <span>Sessions</span></button>
      <button class="nav-item" [class.active]="view()==='memory'" (click)="setView('memory')">◈ <span>Memory</span></button>
      <div class="nav-section">RESOURCES</div>
      <button class="nav-item" [class.active]="view()==='agents'" (click)="setView('agents')">◎ <span>Agents</span></button>
      <button class="nav-item" [class.active]="view()==='skills'" (click)="setView('skills')">◇ <span>Skills</span></button>
      <button class="nav-item" [class.active]="view()==='prompts'" (click)="setView('prompts')">¶ <span>Prompts</span></button>
      <button class="nav-item" [class.active]="view()==='tools'" (click)="setView('tools')">⌁ <span>Tools</span></button>
      <button class="nav-item" [class.active]="view()==='mcp'" (click)="setView('mcp')">⇄ <span>MCP Servers</span></button>
      <button class="nav-item" [class.active]="view()==='knowledge'" (click)="setView('knowledge')">▤ <span>Knowledge</span></button>
      <div class="nav-section">GOVERNANCE & QUALITY</div>
      <button class="nav-item" [class.active]="view()==='governance'" (click)="setView('governance')">⚖ <span>Governance</span></button>
      <button class="nav-item" [class.active]="view()==='evals'" (click)="setView('evals')">◌ <span>Evals</span></button>
      <div class="nav-section">OPERATIONS</div>
      <button class="nav-item" [class.active]="view()==='runtime'" (click)="setView('runtime')">⚙ <span>Runtime</span></button>
    </nav>
    <div class="sidebar-bottom"><span class="profile-dot">CP</span><div><strong>Control Plane</strong><small>v{{overview()?.version||'—'}}</small></div></div>
  </aside>

  <main class="main-content">
    <div class="topbar">
      <div><span class="eyebrow">AI PLATFORM · CONTROL PLANE</span><h1>{{view()==='dashboard'?'Platform overview':view()|titlecase}}</h1></div>
      <div class="top-actions"><span class="environment">● Runtime connected</span><button class="ghost" (click)="refreshAll()">↻ Refresh</button></div>
    </div>
    <div class="error-banner" *ngIf="error()">{{error()}} <button (click)="error.set('')">×</button></div>

    <app-dashboard-view [host]="this"></app-dashboard-view>

    <app-executions-view [host]="this"></app-executions-view>

    <app-approvals-view [host]="this"></app-approvals-view>


    <app-processes-view [host]="this"></app-processes-view>

    <app-services-view [host]="this"></app-services-view>

    <app-sessions-view [host]="this"></app-sessions-view>

    <app-memory-view [host]="this"></app-memory-view>

    <app-agents-view [host]="this"></app-agents-view>

    <app-skills-view [host]="this"></app-skills-view>

    <app-prompts-view [host]="this"></app-prompts-view>

    <app-tools-view [host]="this"></app-tools-view>

    <app-mcp-view [host]="this"></app-mcp-view>

    <app-knowledge-view [host]="this"></app-knowledge-view>


    <app-governance-view [host]="this"></app-governance-view>

    <app-evals-view [host]="this"></app-evals-view>

    <app-runtime-view [host]="this"></app-runtime-view>
  </main>
</div>

<app-execution-dialog [host]="this"></app-execution-dialog><app-editor-dialog [host]="this"></app-editor-dialog><div class="loading" *ngIf="busy()">Working…</div>
