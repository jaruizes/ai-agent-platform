<ng-container *ngIf="host.modal()==='governance-policy'"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Description<input [(ngModel)]="host.draft.description"></label><div class="form-grid two"><label>Policy type<select [(ngModel)]="host.draft.policyType"><option>RESOURCE_ACCESS</option><option>SIDE_EFFECT</option><option>MODEL_ACCESS</option><option>KNOWLEDGE_ACCESS</option><option>MEMORY_ACCESS</option></select></label><label>Effect<select [(ngModel)]="host.draft.effect"><option>ALLOW</option><option>DENY</option><option>REQUIRE_APPROVAL</option></select></label><label>Resource type<select [(ngModel)]="host.draft.resourceType"><option>TOOL</option><option>AGENT</option><option>KNOWLEDGE</option><option>MODEL</option><option>MEMORY_SCOPE</option></select></label><label>Resource pattern<input [(ngModel)]="host.draft.resourcePattern"></label><label>Subject type<select [(ngModel)]="host.draft.subjectType"><option>GLOBAL</option><option>TENANT</option><option>TEAM</option><option>USER</option><option>AGENT</option></select></label><label>Subject pattern<input [(ngModel)]="host.draft.subjectPattern"></label><label>Priority<input type="number" [(ngModel)]="host.draft.priority"></label></div><label>Conditions JSON<textarea rows="5" class="mono" [(ngModel)]="host.draft.conditions"></textarea></label><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='governance-budget'"><label>Name<input [(ngModel)]="host.draft.name"></label><div class="form-grid two"><label>Scope<select [(ngModel)]="host.draft.scopeType"><option>GLOBAL</option><option>EXECUTION</option><option>TENANT</option><option>TEAM</option><option>USER</option><option>AGENT</option></select></label><label>Scope id<input [(ngModel)]="host.draft.scopeId"></label><label>Period<select [(ngModel)]="host.draft.period"><option>EXECUTION</option><option>DAILY</option><option>MONTHLY</option></select></label><label>Action<select [(ngModel)]="host.draft.action"><option>DENY</option><option>DEGRADE</option></select></label><label>Max prompt tokens<input type="number" [(ngModel)]="host.draft.maxPromptTokens"></label><label>Max completion tokens<input type="number" [(ngModel)]="host.draft.maxCompletionTokens"></label><label>Max total tokens<input type="number" [(ngModel)]="host.draft.maxTotalTokens"></label><label>Max cost USD<input type="number" step="0.000001" [(ngModel)]="host.draft.maxCostUsd"></label><label *ngIf="host.draft.action==='DEGRADE'">Degrade model profile<input [(ngModel)]="host.draft.degradeModelProfile"></label></div><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>
