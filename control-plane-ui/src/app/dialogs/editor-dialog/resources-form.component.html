<ng-container *ngIf="host.modal()==='skill'"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Description<input [(ngModel)]="host.draft.description"></label><label>Instructions<textarea rows="12" [(ngModel)]="host.draft.instructions"></textarea></label><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='agent'"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Description<input [(ngModel)]="host.draft.description"></label><label>Instructions<textarea rows="10" [(ngModel)]="host.draft.instructions"></textarea></label><div class="checkbox-grid"><label class="check" *ngFor="let s of host.skills()"><input type="checkbox" [checked]="host.draft.skills?.includes(s.name)" (change)="host.toggleSkill(s.name,$any($event.target).checked)"> {{s.name}}</label></div><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='agent-knowledge'"><p>Knowledge assigned to <strong>{{host.draft.name}}</strong>. Choose usage mode or “Not assigned”.</p><div class="assignment-list"><label *ngFor="let kb of host.knowledgeBases()"><span>{{kb.name}}</span><select [ngModel]="host.knowledgeDraft[kb.name]||''" (ngModelChange)="host.setKbAssignment(kb.name,$event)"><option value="">Not assigned</option><option value="REFERENCE">REFERENCE</option><option value="GUARDRAIL">GUARDRAIL</option></select></label></div></ng-container>

<ng-container *ngIf="host.modal()==='prompt'"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Description<input [(ngModel)]="host.draft.description"></label><label>Version<input type="number" [(ngModel)]="host.draft.version"></label><label>Content<textarea rows="20" class="mono" [(ngModel)]="host.draft.content"></textarea></label><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='tool'"><div class="form-grid two"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Implementation<select [(ngModel)]="host.draft.implementationType"><option>MCP</option><option>GOOGLE_DRIVE_READ</option><option>GOOGLE_DOCS_ARTIFACT_WRITE</option></select></label><label>Side effect<select [(ngModel)]="host.draft.sideEffect"><option>NONE</option><option>READ</option><option>WRITE</option><option>EXTERNAL_ACTION</option></select></label><label>Approval policy<select [(ngModel)]="host.draft.approvalPolicy"><option>NEVER</option><option>OPTIONAL</option><option>REQUIRED</option></select></label></div><label>Description<input [(ngModel)]="host.draft.description"></label><label>Instructions<textarea rows="5" [(ngModel)]="host.draft.instructions"></textarea></label><label>Configuration JSON<textarea rows="6" class="mono" [(ngModel)]="host.draft.configuration"></textarea></label><label>Input Schema JSON<textarea rows="8" class="mono" [(ngModel)]="host.draft.inputSchema"></textarea></label><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='mcp'"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Description<input [(ngModel)]="host.draft.description"></label><label>Command<input [(ngModel)]="host.draft.command"></label><label>Args JSON<textarea rows="3" class="mono" [(ngModel)]="host.draft.args"></textarea></label><label>CWD<input [(ngModel)]="host.draft.cwd"></label><label>Environment JSON<textarea rows="5" class="mono" [(ngModel)]="host.draft.environment"></textarea></label><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='kb'"><label>Name<input [(ngModel)]="host.draft.name"></label><label>Description<input [(ngModel)]="host.draft.description"></label><div class="form-grid two"><label>Scope<select [(ngModel)]="host.draft.scope"><option>TENANT</option><option>GLOBAL</option><option>EXECUTION</option></select></label><label>Retention<select [(ngModel)]="host.draft.retentionPolicy"><option>PERSISTENT</option><option>EPHEMERAL</option></select></label><label>Chunk strategy<select [(ngModel)]="host.draft.chunkingPolicy.strategy"><option>PARAGRAPH</option><option>FIXED</option><option>HEADING</option><option>PAGE</option><option>HIERARCHICAL</option></select></label><label>Chunk size<input type="number" [(ngModel)]="host.draft.chunkingPolicy.chunkSize"></label></div><label class="check"><input type="checkbox" [(ngModel)]="host.draft.enabled"> Enabled</label></ng-container>

<ng-container *ngIf="host.modal()==='google-doc'"><label>Source type<select [(ngModel)]="host.draft.sourceType"><option>GOOGLE_DOCS</option><option>GOOGLE_SLIDES</option><option>GOOGLE_SHEETS</option></select></label><label>Google resource ID<input [(ngModel)]="host.draft.sourceId"></label><label>Name<input [(ngModel)]="host.draft.name"></label><label>Source URI<input [(ngModel)]="host.draft.sourceUri"></label></ng-container>
