<ng-container *ngIf="host.modal()==='session'"><label>Name<input [(ngModel)]="host.draft.name"></label><div class="form-grid two"><label>Scope<select [(ngModel)]="host.draft.scope"><option>USER</option><option>TEAM</option><option>TENANT</option></select></label><label>Owner key<input [(ngModel)]="host.draft.ownerKey" placeholder="required for USER/TEAM; useful for TENANT"></label></div><label>Expires at<input type="datetime-local" [(ngModel)]="host.draft.expiresAt"></label><label>Metadata JSON<textarea rows="5" class="mono" [(ngModel)]="host.draft.metadata"></textarea></label></ng-container>

<ng-container *ngIf="host.modal()==='session-inspect' && host.selectedSession() as s"><div class="execution-summary"><span class="status-pill" [ngClass]="host.statusClass(s.status)">{{s.status}}</span><span>{{s.name||s.id}}</span><span>{{s.scope}} · {{s.ownerKey||'—'}}</span></div><h3>Executions</h3><div class="doc-list"><article *ngFor="let x of host.sessionExecutions()"><div><strong>{{x.command_name||x.commandName||'execution'}}</strong><small class="mono">{{x.id}}</small></div><span class="status-pill" [ngClass]="host.statusClass(x.status)">{{x.status}}</span></article></div><details class="json-details" open><summary>Working Context · {{host.sessionContext().length}} entries</summary><pre>{{host.json(host.sessionContext())}}</pre></details></ng-container>

<ng-container *ngIf="host.modal()==='memory'"><div class="form-grid two"><label>Scope<select [(ngModel)]="host.draft.scopeType"><option>SESSION</option><option>USER</option><option>TEAM</option><option>TENANT</option><option>AGENT</option></select></label><label>Scope id<input [(ngModel)]="host.draft.scopeId"></label><label>Type<select [(ngModel)]="host.draft.memoryType"><option>FACT</option><option>PREFERENCE</option><option>DECISION</option><option>CONSTRAINT</option><option>SUMMARY</option><option>LEARNED_CONTEXT</option></select></label><label>Key<input [(ngModel)]="host.draft.key"></label><label>Importance<input type="number" min="0" max="1" step="0.1" [(ngModel)]="host.draft.importance"></label><label>Expires at<input type="datetime-local" [(ngModel)]="host.draft.expiresAt"></label></div><label>Content<textarea rows="8" [(ngModel)]="host.draft.content"></textarea></label></ng-container>
