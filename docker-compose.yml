services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  nats-exporter:
    platform: linux/amd64
    image: natsio/prometheus-nats-exporter:0.17.3
    command: ["-varz", "-jsz=all", "http://nats:8222"]
    ports:
      - "7777:7777"
    depends_on:
      - nats

  ollama:
    image: ollama/ollama:0.11.10
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:0.11.10
    entrypoint: ["/bin/sh", "-c"]
    command: ["OLLAMA_HOST=http://ollama:11434 ollama pull nomic-embed-text"]
    depends_on:
      ollama:
        condition: service_healthy

  litellm:
    platform: linux/amd64
    image: docker.litellm.ai/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set}
      ANTHROPIC_ROUTER_MODEL: ${ANTHROPIC_ROUTER_MODEL:-anthropic/claude-haiku-4-5-20251001}
      ANTHROPIC_EXECUTION_MODEL: ${ANTHROPIC_EXECUTION_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-key}
      OLLAMA_API_BASE: http://ollama:11434
    volumes:
      - ./litellm/litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      ollama-init:
        condition: service_completed_successfully

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - nats-exporter

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  agent-platform:
    build:
      context: .
      dockerfile: agent-platform/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_platform}
      NATS_URL: nats://nats:4222
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-key}
      ROUTER_MODEL_PROFILE: router-fast
      EXECUTION_MODEL_PROFILE: reasoning-default
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-60}
      MCP_MAX_MESSAGE_BYTES: ${MCP_MAX_MESSAGE_BYTES:-16777216}
      MAX_TOOL_RESULT_CHARS_FOR_MODEL: ${MAX_TOOL_RESULT_CHARS_FOR_MODEL:-500000}
      EMBEDDING_MODEL_PROFILE: embedding-default
      KNOWLEDGE_STORAGE_ROOT: /data/knowledge
      KNOWLEDGE_CHUNK_SIZE_CHARS: ${KNOWLEDGE_CHUNK_SIZE_CHARS:-3500}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-400}
      KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-8}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./.secrets:/run/secrets/google:ro
      - knowledge-data:/data/knowledge
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      litellm:
        condition: service_started
      otel-collector:
        condition: service_started

volumes:
  postgres-data:
  nats-data:
  prometheus-data:
  grafana-data:
  ollama-data:
  knowledge-data:
