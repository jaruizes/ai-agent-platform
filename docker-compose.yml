services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_platform}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_platform}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  nats-exporter:
    platform: linux/amd64
    image: natsio/prometheus-nats-exporter:0.17.3
    command: ["-varz", "-jsz=all", "http://nats:8222"]
    ports:
      - "7777:7777"
    depends_on:
      - nats

  litellm:
    platform: linux/amd64
    image: docker.litellm.ai/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set}
      ANTHROPIC_ROUTER_MODEL: ${ANTHROPIC_ROUTER_MODEL:-anthropic/claude-haiku-4-5-20251001}
      ANTHROPIC_EXECUTION_MODEL: ${ANTHROPIC_EXECUTION_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      ANTHROPIC_PLANNER_MODEL: ${ANTHROPIC_PLANNER_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-key}
    volumes:
      - ./litellm/litellm-config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
      - nats-exporter

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  agent-platform:
    build:
      context: .
      dockerfile: agent-platform/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agent}:${POSTGRES_PASSWORD:-agent}@postgres:5432/${POSTGRES_DB:-agent_platform}
      NATS_URL: nats://nats:4222
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev-key}
      ROUTER_MODEL_PROFILE: router-fast
      EXECUTION_MODEL_PROFILE: reasoning-default
      PLANNER_MODEL_PROFILE: planner-default
      ORCHESTRATION_MAX_STEPS: ${ORCHESTRATION_MAX_STEPS:-12}
      EXECUTION_LEASE_SECONDS: ${EXECUTION_LEASE_SECONDS:-30}
      EXECUTION_HEARTBEAT_SECONDS: ${EXECUTION_HEARTBEAT_SECONDS:-10}
      EXECUTION_CONTROL_POLL_SECONDS: ${EXECUTION_CONTROL_POLL_SECONDS:-0.5}
      MCP_TIMEOUT_SECONDS: ${MCP_TIMEOUT_SECONDS:-60}
      MCP_MAX_MESSAGE_BYTES: ${MCP_MAX_MESSAGE_BYTES:-16777216}
      MAX_TOOL_RESULT_CHARS_FOR_MODEL: ${MAX_TOOL_RESULT_CHARS_FOR_MODEL:-500000}
      KNOWLEDGE_EMBEDDING_PROVIDER: hash
      KNOWLEDGE_EMBEDDING_MODEL: hash-embedding-v1
      KNOWLEDGE_EMBEDDING_DIMENSIONS: 768
      KNOWLEDGE_STORAGE_ROOT: /data/knowledge
      KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      KNOWLEDGE_TOP_K: ${KNOWLEDGE_TOP_K:-8}
      MEMORY_ALLOW_INFERRED_PERSISTENCE: ${MEMORY_ALLOW_INFERRED_PERSISTENCE:-true}
      MEMORY_MIN_INFERRED_CONFIDENCE: ${MEMORY_MIN_INFERRED_CONFIDENCE:-0.80}
      MEMORY_MAX_CONTENT_CHARS: ${MEMORY_MAX_CONTENT_CHARS:-8000}
      MEMORY_CLEANUP_POLL_SECONDS: ${MEMORY_CLEANUP_POLL_SECONDS:-60}
      MEMORY_AUTO_EXTRACT_SESSION: ${MEMORY_AUTO_EXTRACT_SESSION:-true}
      MEMORY_EXTRACTOR_MODEL_PROFILE: ${MEMORY_EXTRACTOR_MODEL_PROFILE:-router-fast}
      MEMORY_EXTRACTOR_MAX_CANDIDATES: ${MEMORY_EXTRACTOR_MAX_CANDIDATES:-8}
      MEMORY_EXTRACTOR_MAX_INPUT_CHARS: ${MEMORY_EXTRACTOR_MAX_INPUT_CHARS:-50000}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    volumes:
      - ./.secrets:/run/secrets/google:ro
      - knowledge-data:/data/knowledge
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      litellm:
        condition: service_started
      otel-collector:
        condition: service_started

  control-plane-ui:
    build:
      context: .
      dockerfile: control-plane-ui/Dockerfile
    ports:
      - "${CONTROL_PLANE_PORT:-8081}:80"
    depends_on:
      agent-platform:
        condition: service_started


volumes:
  postgres-data:
  nats-data:
  prometheus-data:
  grafana-data:
  knowledge-data:
